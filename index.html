<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maptiles</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #menu {
            background: #fff;
            position: absolute;
            z-index: 1;
            top: 10px;
            right: 10px;
            border-radius: 3px;
            width: 120px;
            border: 1px solid rgba(0, 0, 0, 0.4);
            font-family: 'Open Sans', sans-serif;
        }

        #menu a {
            font-size: 13px;
            color: #404040;
            display: block;
            margin: 0;
            padding: 0;
            padding: 10px;
            text-decoration: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        #menu a:last-child {
            border: none;
        }

        #menu a:hover {
            background-color: #f8f8f8;
            color: #404040;
        }

        #menu a.active {
            background-color: #3887be;
            color: #ffffff;
        }

        #menu a.active:hover {
            background: #3074a4;
        }
</style>
</head>
<body>
  <nav id="menu"></nav>
  <div id = 'map'></div>
<script>
   mapboxgl.accessToken = 'pk.eyJ1Ijoia25lbDIiLCJhIjoiY21rdTlkYmx5MThyZjNmcHVrMDYzdXJ4dyJ9.HrXpvWOlXxo7fGCGnGQG6A';
    const map = new mapboxgl.Map({
        container: 'map',
        center: [-122.33, 47.61],
        zoom: 11
    });

  map.on('load', () => {
  map.addSource('basemap-tiles', {
    type: 'raster',
    tiles: [
      'assets/Basemap/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
  });

map.addSource('thematic-crime-tile', {
    type: 'raster',
    tiles: [
      'assets/thematic_tiles_map/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
  });

map.addSource('crime-base-tile', {
    type: 'raster',
    tiles: [
      'assets/Basemap_crime_data/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
});

map.addSource('theme-tile', {
    type: 'raster',
    tiles: [
      'assets/publicsafetytheme/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
});

map.addLayer({
  id: 'base',
  type: 'raster',
  source: 'basemap-tiles',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
  });

map.addLayer({
  id: 'thematic crime',
  type: 'raster',
  source: 'thematic-crime-tile',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
});

map.addLayer({
  id: 'Basemapcrime',
  type: 'raster',
  source: 'crime-base-tile',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
});

map.addLayer({
  id: 'theme',
  type: 'raster',
  source: 'theme-tile',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
});

map.on('idle', () => {
    if (!map.getLayer('base') || !map.getLayer('thematic crime') || !map.getLayer('Basemapcrime') || !map.getLayer('theme')) {
      return;
    }

    const toggleableLayerIds = ['base', 'thematic crime', 'Basemapcrime', 'theme'];

      for (const id of toggleableLayerIds) {
          if (document.getElementById(id)) {
                  continue;
          }

          // Create a link.
                const link = document.createElement('a');
                link.id = id;
                link.href = '#';
                link.textContent = id;
                link.className = map.getLayoutProperty(id, 'visibility') === 'visible' ? 'active' : '';

                link.onclick = function (e) {
                    const clickedLayer = this.textContent;
                    e.preventDefault();

                    e.stopPropagation();

                    const visibility = map.getLayoutProperty(
                        clickedLayer,
                        'visibility'
                    );


                    if (visibility === 'visible') {
                        map.setLayoutProperty(clickedLayer, 'visibility', 'none');
                        this.className = '';
                    } else { //otherise, it will be turned on.
                        this.className = 'active';
                        map.setLayoutProperty(
                            clickedLayer,
                            'visibility',
                            'visible'
                        );
                    }
                };

                document.getElementById('menu').appendChild(link);
            }
        });
});
</script>
</body>
</html>
