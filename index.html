<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maptiles</title>
</head>
<body>
  <div id = 'map'></div>
<script>
   mapboxgl.accessToken = 'pk.eyJ1Ijoia25lbDIiLCJhIjoiY21rdTlkYmx5MThyZjNmcHVrMDYzdXJ4dyJ9.HrXpvWOlXxo7fGCGnGQG6A';
    const map = new mapboxgl.Map({
        container: 'map', // container ID
        center: [-74.5, 40], // starting position [lng, lat]. Note that lat must be set between -90 and 90
        zoom: 9 // starting zoom
    });
  map.on('load', () => {
  map.addSource('uw-tiles', {
    type: 'raster',
    tiles: [
      'assets/uw/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Bo Zhao'
  });

  map.addLayer({
    id: 'uw',
    type: 'raster',
    source: 'uw-tiles',
    layout: {
      // 'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
  });
});
</script>
</body>
</html>
