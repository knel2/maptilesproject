<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maptiles</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
  <div id = 'map'></div>
<script>
   mapboxgl.accessToken = 'pk.eyJ1Ijoia25lbDIiLCJhIjoiY21rdTlkYmx5MThyZjNmcHVrMDYzdXJ4dyJ9.HrXpvWOlXxo7fGCGnGQG6A';
    const map = new mapboxgl.Map({
        container: 'map',
        center: [-122.33, 47.61],
        zoom: 11
    });

  map.on('load', () => {
  map.addSource('basemap-tiles', {
    type: 'raster',
    tiles: [
      'assets/uw/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
  });

map.addSource('thematic-crime-tile', {
    type: 'raster',
    tiles: [
      'assets/uw/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
  });

map.addSource('crime-base-tile', {
    type: 'raster',
    tiles: [
      'assets/uw/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
});

map.addSource('theme-tile', {
    type: 'raster',
    tiles: [
      'assets/uw/{z}/{x}/{y}.png'
    ],
    tileSize: 256,
    attribution: 'Map tiles designed by Katherine'
});

map.addLayer({
  id: 'base',
  type: 'raster',
  source: 'basemap-tiles',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
  });

map.addLayer({
  id: 'thematic',
  type: 'raster',
  source: 'thematic-crime-tile',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
});

map.addLayer({
  id: 'crimeb',
  type: 'raster',
  source: 'crime-base-tile',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
});

map.addLayer({
  id: 'theme',
  type: 'raster',
  source: 'theme-tile',
  layout: {
      'visibility': 'none'
      // Uncomment the line above to hide this layer on initial load.
      // This is useful when you add multiple tile layers.
    }
});

});
</script>
</body>
</html>
